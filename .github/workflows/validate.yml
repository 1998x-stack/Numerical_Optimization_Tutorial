name: Validate course

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Static validation
        run: python scripts/validate_course.py
      - name: Unit and example tests
        run: python -m unittest discover -s tests -v
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser QA
        run: python scripts/browser_check.py --output reports/course
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numerical-optimization-browser-qa
          path: reports/course/
          if-no-files-found: ignore
