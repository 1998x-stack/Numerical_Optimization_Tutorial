<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 240" role="img" aria-labelledby="ex-check-title ex-check-desc"><title id="ex-check-title">三个独立判断</title><desc id="ex-check-desc">流程图：割线方程→正定性→适用框架，三者依次但相互独立，不能合并为一个结论。</desc><rect width="660" height="240" rx="16" fill="#f7f4ee"/><rect x="40" y="90" width="150" height="56" rx="10" fill="#7fbcb0"/><rect x="255" y="90" width="150" height="56" rx="10" fill="#126e66"/><rect x="470" y="90" width="150" height="56" rx="10" fill="#263a33"/><g font-size="14" font-family="system-ui, sans-serif"><text x="58" y="115">割线方程</text><text x="58" y="135">（定义层）</text><text x="275" y="115" fill="#fff">保正定？</text><text x="275" y="135" fill="#fff">（性质层）</text><text x="488" y="115" fill="#fff">线搜索 / 信赖域</text><text x="488" y="135" fill="#fff">（框架层）</text></g><line x1="190" y1="118" x2="255" y2="118" stroke="#263a33" stroke-width="2" marker-end="url(#exarrow)"/><line x1="405" y1="118" x2="470" y2="118" stroke="#263a33" stroke-width="2" marker-end="url(#exarrow)"/><defs><marker id="exarrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#263a33"/></marker></defs></svg>