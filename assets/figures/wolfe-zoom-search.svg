<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" role="img" aria-labelledby="title desc"><title id="title">Wolfe 扩张和 zoom 两阶段</title><desc id="desc">一维试探从 0.5 扩张到 1 和 2；另一种起点 4 回退到区间 0 到 4 的中点 2，最终满足强 Wolfe。</desc><rect width="860" height="310" rx="18" fill="#fbfaf6"/><path d="M80 148H790" stroke="#9cafaa" stroke-width="3"/><g stroke="#9cafaa" stroke-width="1.5"><path d="M80 140v18M255 140v18M430 140v18M780 140v18"/></g><g font-size="17" fill="#1d2b2a" text-anchor="middle"><text x="80" y="186">0</text><text x="168" y="186">0.5</text><text x="255" y="186">1</text><text x="430" y="186">2</text><text x="780" y="186">4</text></g><path d="M168 121Q300 69 430 121" fill="none" stroke="#126e66" stroke-width="4"/><path d="M780 121Q610 42 430 121" fill="none" stroke="#bd633f" stroke-width="4" stroke-dasharray="9 6"/><g font-size="16"><text x="181" y="64" fill="#126e66">扩张：0.5 → 1 → 2</text><text x="557" y="57" fill="#bd633f">zoom(0,4) → 2</text><text x="410" y="239" fill="#126e66">α=2：函数值下降、斜率为 0</text><text x="410" y="270" fill="#61716d">试探点 4 因 Armijo 失败而被拒绝</text></g><circle cx="168" cy="148" r="8" fill="#126e66"/><circle cx="255" cy="148" r="8" fill="#126e66"/><circle cx="430" cy="148" r="11" fill="#126e66"/><circle cx="780" cy="148" r="9" fill="#bd633f"/></svg>