<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" role="img" aria-labelledby="title desc"><title id="title">Cauchy 点的两种半径情形</title><desc id="desc">左侧大球内 Cauchy 点沿负梯度方向位于球内部；右侧小球中步长被半径截断在球边界。</desc><rect width="860" height="290" rx="18" fill="#fbfaf6"/><circle cx="240" cy="143" r="112" stroke="#126e66" stroke-width="3" fill="#e4f2ec" fill-opacity=".6"/><circle cx="612" cy="143" r="65" stroke="#bd633f" stroke-width="3" fill="#fce9dc" fill-opacity=".6"/><path d="M240 143h-142M612 143h-98" stroke="#126e66" stroke-width="5"/><circle cx="185" cy="143" r="9" fill="#126e66"/><circle cx="547" cy="143" r="9" fill="#bd633f"/><g fill="#263a33" font-size="18"><text x="151" y="25">Δ=1</text><text x="565" y="53">Δ=0.2</text><text x="128" y="267">pᶜ=(−0.5,0)</text><text x="554" y="246">pᶜ=(−0.2,0)</text></g></svg>