<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 328" role="img" aria-labelledby="title desc"><title id="title">同一半径下 L1 菱形、L2 圆形和 L∞ 方形</title><desc id="desc">从左到右三幅坐标图分别显示 L1 范数的菱形、L2 范数的圆形和 L∞ 范数的正方形；后者允许更多角落位置。</desc><rect width="860" height="328" rx="18" fill="#fbfaf6"/><g stroke="#abb9b3" stroke-width="1.5"><path d="M54 171H244M149 78V263M335 171H525M430 78V263M619 171H810M714 78V263"/></g><polygon points="149,82 238,171 149,260 60,171" fill="#fce9dc" stroke="#bd633f" stroke-width="3"/><circle cx="430" cy="171" r="90" fill="#e4f2ec" stroke="#126e66" stroke-width="3"/><rect x="625" y="81" width="178" height="180" fill="#eeeafa" stroke="#7765af" stroke-width="3"/><g font-size="20" text-anchor="middle" font-weight="700" fill="#263a34"><text x="149" y="45">L1 · 菱形</text><text x="430" y="45">L2 · 圆形</text><text x="714" y="45">L∞ · 方框</text></g><text x="42" y="305" font-size="16" fill="#657671">同半径：L1 球 ⊆ L2 球 ⊆ L∞ 球；可行候选集合发生变化</text></svg>