<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" role="img" aria-labelledby="title desc"><title id="title">Dogleg 两段折线与球形信赖域</title><desc id="desc">折线从原点到最速下降点 U，转向 Newton 点 B；信赖域边界可与折线第二段相交。</desc><rect width="860" height="310" rx="18" fill="#fbfaf6"/><circle cx="282" cy="139" r="118" fill="#e4f2ec" fill-opacity=".6" stroke="#b1c9bf" stroke-width="3"/><path d="M282 139L213 208L235 282" fill="none" stroke="#126e66" stroke-width="6"/><circle cx="282" cy="139" r="6" fill="#263a33"/><circle cx="213" cy="208" r="9" fill="#126e66"/><circle cx="225" cy="251" r="8" fill="#bd633f"/><circle cx="235" cy="282" r="8" fill="#7461ba"/><g fill="#263a33" font-size="18"><text x="297" y="140">0</text><text x="140" y="202">pᵁ</text><text x="250" y="278">pᴮ</text><text x="472" y="98">第一段：0 → pᵁ</text><text x="472" y="144">第二段：pᵁ → pᴮ</text><text x="472" y="198">球面可能截断其中一段</text><text x="472" y="251" font-size="15" fill="#61716d">B 正定才有标准 Dogleg 保证</text></g></svg>