<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" role="img" aria-labelledby="title desc"><title id="title">相同半径内改善 Cauchy 点</title><desc id="desc">单位圆中一条从中心朝左下方的 Cauchy 步和另一条偏向低曲率方向的候选步，后者的模型下降更大。</desc><rect width="860" height="290" rx="18" fill="#fbfaf6"/><circle cx="268" cy="144" r="116" stroke="#a3c4b7" stroke-width="2.5" fill="#e4f2ec" fill-opacity=".6"/><path d="M268 144L186 226" stroke="#126e66" stroke-width="6"/><path d="M268 144L210 244" stroke="#bd633f" stroke-width="6"/><circle cx="186" cy="226" r="8" fill="#126e66"/><circle cx="210" cy="244" r="8" fill="#bd633f"/><g fill="#263a33" font-size="18"><text x="467" y="90">Cauchy 下降 ≈ 1.5784</text><text x="467" y="140">偏转后下降 ≈ 1.8571</text><text x="467" y="199" font-size="16">同样长度，都留在信赖域内</text></g></svg>