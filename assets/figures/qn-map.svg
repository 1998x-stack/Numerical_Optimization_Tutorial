<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 260" role="img" aria-labelledby="qn-map-title qn-map-desc"><title id="qn-map-title">拟牛顿更新的分类</title><desc id="qn-map-desc">根节点为割线方程约束；左支为秩二（DFP/BFGS）经参数 φ 构成 Broyden 族，右支为秩一 SR1。</desc><rect width="660" height="260" rx="16" fill="#f7f4ee"/><rect x="250" y="30" width="160" height="46" rx="10" fill="#263a33"/><text x="270" y="59" font-size="15" fill="#fff" font-family="system-ui, sans-serif">割线方程 Bs=y</text><line x1="290" y1="76" x2="170" y2="140" stroke="#126e66" stroke-width="2"/><line x1="370" y1="76" x2="490" y2="140" stroke="#bd633f" stroke-width="2"/><rect x="90" y="140" width="170" height="46" rx="10" fill="#7fbcb0"/><text x="110" y="168" font-size="14" font-family="system-ui, sans-serif">秩二：DFP / BFGS</text><rect x="410" y="140" width="160" height="46" rx="10" fill="#e6b8a8"/><text x="440" y="168" font-size="14" font-family="system-ui, sans-serif">秩一：SR1</text><text x="100" y="220" font-size="13" font-family="system-ui, sans-serif" fill="#126e66">φ∈[0,1] → Broyden 族（保正定）</text><text x="420" y="220" font-size="13" font-family="system-ui, sans-serif" fill="#bd633f">可不定 → 信赖域</text></svg>