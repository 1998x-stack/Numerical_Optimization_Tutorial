<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 316" role="img" aria-labelledby="title desc"><title id="title">近精确步捕获最优模型下降的比例</title><desc id="desc">t 为 0.5、1.5 和最优边界值时，模型下降占比分别约为 12.7%、60.7% 和 100%，虚线标出 c1 等于 0.6 的门槛。</desc><rect width="860" height="316" rx="18" fill="#fbfaf6"/><text x="33" y="43" font-size="20" font-weight="700" fill="#243b34">固定 Δ=2：候选步的下降质量</text><g fill="#263b34" font-size="18"><text x="35" y="110">t=0.5</text><text x="35" y="180">t=1.5</text><text x="35" y="251">最优</text></g><rect x="150" y="80" width="82" height="42" rx="6" fill="#c78060"/><rect x="150" y="151" width="395" height="42" rx="6" fill="#126e66"/><rect x="150" y="222" width="650" height="42" rx="6" fill="#126e66"/><path d="M541 64V274" stroke="#bd6346" stroke-width="2.5" stroke-dasharray="8 5"/><g font-size="16" fill="#263b34"><text x="243" y="108">12.7%</text><text x="559" y="178">60.7%</text><text x="746" y="250" fill="#fff">100%</text><text x="493" y="61" fill="#aa573f">c₁=0.6</text></g><text x="33" y="294" fill="#657772" font-size="14">条形表示模型下降比例，而非真实运行速度</text></svg>