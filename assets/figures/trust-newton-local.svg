<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" role="img" aria-labelledby="title desc"><title id="title">信赖域 Newton 从截断到完整步</title><desc id="desc">左侧完整 Newton 步长度超过信赖域圆半径，改用截断步；右侧接近极小点，完整 Newton 步落在信赖域内部。</desc><rect width="860" height="320" rx="18" fill="#fbfaf6"/><g fill="#263b34" font-size="20" font-weight="700"><text x="42" y="50">远处：完整 Newton 步越界</text><text x="467" y="50">近处：完整 Newton 步可行</text></g><circle cx="223" cy="170" r="78" fill="#fce9dc" stroke="#bb8063" stroke-width="3"/><circle cx="640" cy="170" r="94" fill="#e4f2ec" stroke="#86b7a8" stroke-width="3"/><path d="M223 170H90" stroke="#bd633f" stroke-width="5"/><path d="M223 170H145" stroke="#126e66" stroke-width="9"/><path d="M640 170H578" stroke="#126e66" stroke-width="9"/><circle cx="223" cy="170" r="7" fill="#253b34"/><circle cx="640" cy="170" r="7" fill="#253b34"/><g fill="#64756f" font-size="16"><text x="69" y="294">信赖域先保护远处的大步</text><text x="490" y="294">局部模型准确后放行完整步</text></g></svg>