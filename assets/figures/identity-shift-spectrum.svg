<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-labelledby="title desc"><title id="title">对角平移把整条特征值谱一并右移</title><desc id="desc">原特征值为负 1 和 3；加 1.5 倍单位矩阵后变成 0.5 和 4.5。</desc><rect width="860" height="300" rx="18" fill="#fbfaf6"/><text x="35" y="46" font-size="20" font-weight="700" fill="#263a33">对角平移把整条特征值谱一并右移</text><text x="35" y="70" font-size="14" fill="#63756f">同样的 τ 加在每个特征值上</text><rect x="28" y="92" width="188" height="124" rx="14" fill="#e4f2ec" stroke="#176e62" stroke-opacity=".35"/><text x="122" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">原 Hessian</text><text x="122" y="166" text-anchor="middle" font-size="16" fill="#176e62">−1，3</text><text x="122" y="192" text-anchor="middle" font-size="13" fill="#61716d">存在负特征值</text><rect x="235" y="92" width="188" height="124" rx="14" fill="#fce9dc" stroke="#a45435" stroke-opacity=".35"/><text x="329" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">选平移 τ</text><text x="329" y="166" text-anchor="middle" font-size="16" fill="#a45435">至少 1.5</text><text x="329" y="192" text-anchor="middle" font-size="13" fill="#61716d">确保最小值 ≥ 0.5</text><rect x="442" y="92" width="188" height="124" rx="14" fill="#efebfa" stroke="#6451a0" stroke-opacity=".35"/><text x="536" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">统一平移</text><text x="536" y="166" text-anchor="middle" font-size="16" fill="#6451a0">λᵢ + τ</text><text x="536" y="192" text-anchor="middle" font-size="13" fill="#61716d">正特征值也增大</text><rect x="649" y="92" width="188" height="124" rx="14" fill="#e4f2ec" stroke="#176e62" stroke-opacity=".35"/><text x="743" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">求解 Bp</text><text x="743" y="166" text-anchor="middle" font-size="16" fill="#176e62">方向下降</text><text x="743" y="192" text-anchor="middle" font-size="13" fill="#61716d">同时检查条件数</text><path d="M218 154h14m-5-6 6 6-6 6" stroke="#657a72" stroke-width="2.4" fill="none"/><path d="M425 154h14m-5-6 6 6-6 6" stroke="#657a72" stroke-width="2.4" fill="none"/><path d="M632 154h14m-5-6 6 6-6 6" stroke="#657a72" stroke-width="2.4" fill="none"/><text x="35" y="267" font-size="14" fill="#61716d">示例中 λ(H) = (−1, 3)，λ(H+1.5I) = (0.5, 4.5)</text></svg>