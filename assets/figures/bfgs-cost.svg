<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" role="img" aria-labelledby="bfgs-cost-title bfgs-cost-desc"><title id="bfgs-cost-title">BFGS 每步代价与内存随维度增长</title><desc id="bfgs-cost-desc">横坐标为维度 n（对数），三条曲线分别为梯度下降 O(n)、BFGS O(n²)、牛顿法 O(n³) 的每步运算量示意。</desc><rect width="660" height="300" rx="16" fill="#f7f4ee"/><line x1="70" y1="250" x2="620" y2="250" stroke="#263a33" stroke-width="2"/><line x1="70" y1="250" x2="70" y2="40" stroke="#263a33" stroke-width="2"/><polyline points="70,230 200,215 340,190 480,155 610,110" fill="none" stroke="#7fbcb0" stroke-width="3"/><polyline points="70,230 200,180 340,110 480,40 560,20" fill="none" stroke="#126e66" stroke-width="4"/><polyline points="70,230 200,120 300,20" fill="none" stroke="#bd633f" stroke-width="4"/><g font-size="15" font-family="system-ui, sans-serif"><text x="500" y="105" fill="#7fbcb0">梯度下降 O(n)</text><text x="440" y="35" fill="#126e66">BFGS O(n²)</text><text x="280" y="30" fill="#bd633f">牛顿 O(n³)</text><text x="600" y="272">n</text><text x="40" y="50">代价</text></g></svg>