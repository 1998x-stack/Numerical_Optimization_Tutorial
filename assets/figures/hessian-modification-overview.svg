<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-labelledby="title desc"><title id="title">从不定 Hessian 到可下降的方向</title><desc id="desc">原 Hessian 存在负曲率方向；正定修正后解 Bp=-g；沿 p 的方向导数严格为负。</desc><rect width="860" height="300" rx="18" fill="#fbfaf6"/><text x="35" y="46" font-size="20" font-weight="700" fill="#263a33">从不定 Hessian 到可下降的方向</text><text x="35" y="70" font-size="14" fill="#63756f">方向的可接受性来自正定性，不等于全局最优性</text><rect x="28" y="92" width="188" height="124" rx="14" fill="#e4f2ec" stroke="#176e62" stroke-opacity=".35"/><text x="122" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">原始曲率</text><text x="122" y="166" text-anchor="middle" font-size="16" fill="#176e62">H 有负特征值</text><text x="122" y="192" text-anchor="middle" font-size="13" fill="#61716d">Newton 方向未必下降</text><rect x="235" y="92" width="188" height="124" rx="14" fill="#fce9dc" stroke="#a45435" stroke-opacity=".35"/><text x="329" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">正定修正</text><text x="329" y="166" text-anchor="middle" font-size="16" fill="#a45435">B = H + E</text><text x="329" y="192" text-anchor="middle" font-size="13" fill="#61716d">修正应尽量温和</text><rect x="442" y="92" width="188" height="124" rx="14" fill="#efebfa" stroke="#6451a0" stroke-opacity=".35"/><text x="536" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">求解方向</text><text x="536" y="166" text-anchor="middle" font-size="16" fill="#6451a0">Bp = −g</text><text x="536" y="192" text-anchor="middle" font-size="13" fill="#61716d">明确方向导数</text><rect x="649" y="92" width="188" height="124" rx="14" fill="#e4f2ec" stroke="#176e62" stroke-opacity=".35"/><text x="743" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">步长搜索</text><text x="743" y="166" text-anchor="middle" font-size="16" fill="#176e62">满足下降准则</text><text x="743" y="192" text-anchor="middle" font-size="13" fill="#61716d">再决定前进距离</text><path d="M218 154h14m-5-6 6 6-6 6" stroke="#657a72" stroke-width="2.4" fill="none"/><path d="M425 154h14m-5-6 6 6-6 6" stroke="#657a72" stroke-width="2.4" fill="none"/><path d="M632 154h14m-5-6 6 6-6 6" stroke="#657a72" stroke-width="2.4" fill="none"/><text x="35" y="267" font-size="14" fill="#61716d">B 正定 ⇒ gᵀp = −pᵀBp ＜ 0（g≠0）</text></svg>