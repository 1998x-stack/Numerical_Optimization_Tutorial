<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" role="img" aria-labelledby="sr1-sign-title sr1-sign-desc"><title id="sr1-sign-title">同一组 s、y 下 BFGS 与 SR1 的特征值符号</title><desc id="sr1-sign-desc">左柱表示 BFGS 更新保持两个正特征值；右柱表示 SR1 在同一数据下可能出现一正一负的不定特征值。</desc><rect width="660" height="300" rx="16" fill="#f7f4ee"/><line x1="90" y1="240" x2="610" y2="240" stroke="#263a33" stroke-width="2"/><line x1="90" y1="60" x2="90" y2="240" stroke="#263a33" stroke-width="2"/><rect x="140" y="95" width="60" height="145" fill="#7fbcb0"/><rect x="210" y="120" width="60" height="120" fill="#7fbcb0"/><rect x="380" y="95" width="60" height="145" fill="#bd633f"/><rect x="450" y="240" width="0" height="0" fill="#bd633f"/><rect x="450" y="245" width="60" height="18" fill="#8a3040"/><g font-size="15" font-family="system-ui, sans-serif" fill="#263a33"><text x="150" y="80">λ₁&gt;0</text><text x="220" y="105">λ₂&gt;0</text><text x="120" y="265">BFGS：正定</text><text x="360" y="80">λ₁&gt;0</text><text x="430" y="300">λ₂&lt;0（向下）</text><text x="355" y="265">SR1：可能不定</text></g></svg>