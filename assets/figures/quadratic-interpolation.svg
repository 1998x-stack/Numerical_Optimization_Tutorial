<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-labelledby="title desc"><title id="title">一个函数值和一个方向导数确定二次插值模型</title><desc id="desc">从 φ(0)、φ′(0) 与 φ(1) 建立二次插值，模型的最低点给出新的试探步长，但未必是真实非二次函数的最小点。</desc><rect width="860" height="300" rx="18" fill="#fbfaf6"/><text x="35" y="46" font-size="20" font-weight="700" fill="#263a33">一个函数值和一个方向导数确定二次插值模型</text><text x="35" y="70" font-size="14" fill="#63756f">把已付出的函数评估重新用于选择步长</text><rect x="28" y="92" width="188" height="124" rx="14" fill="#e4f2ec" stroke="#176e62" stroke-opacity=".35"/><text x="122" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">已知数据</text><text x="122" y="166" text-anchor="middle" font-size="16" fill="#176e62">φ(0)、φ′(0)</text><text x="122" y="192" text-anchor="middle" font-size="13" fill="#61716d">初始值与斜率</text><rect x="235" y="92" width="188" height="124" rx="14" fill="#fce9dc" stroke="#a45435" stroke-opacity=".35"/><text x="329" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">再试探 α₀</text><text x="329" y="166" text-anchor="middle" font-size="16" fill="#a45435">计算 φ(α₀)</text><text x="329" y="192" text-anchor="middle" font-size="13" fill="#61716d">获取曲率线索</text><rect x="442" y="92" width="188" height="124" rx="14" fill="#efebfa" stroke="#6451a0" stroke-opacity=".35"/><text x="536" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">拟合二次</text><text x="536" y="166" text-anchor="middle" font-size="16" fill="#6451a0">q(α)=aα²+bα+c</text><text x="536" y="192" text-anchor="middle" font-size="13" fill="#61716d">由三项约束求系数</text><rect x="649" y="92" width="188" height="124" rx="14" fill="#e4f2ec" stroke="#176e62" stroke-opacity=".35"/><text x="743" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">取模型低点</text><text x="743" y="166" text-anchor="middle" font-size="16" fill="#176e62">α_new=−b/(2a)</text><text x="743" y="192" text-anchor="middle" font-size="13" fill="#61716d">再核对 Armijo</text><path d="M218 154h14m-5-6 6 6-6 6" stroke="#657a72" stroke-width="2.4" fill="none"/><path d="M425 154h14m-5-6 6 6-6 6" stroke="#657a72" stroke-width="2.4" fill="none"/><path d="M632 154h14m-5-6 6 6-6 6" stroke="#657a72" stroke-width="2.4" fill="none"/><text x="35" y="267" font-size="14" fill="#61716d">φ(α)=(α−2)²+εα³：ε=0 时插值精确；ε＞0 时仅是预测</text></svg>