<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" role="img" aria-labelledby="title desc"><title id="title">四个线搜索练习的推导路线</title><desc id="desc">四个独立问题分别检验曲率接受区间、精确步长、回溯过程和负曲率下的下降方向。</desc><rect width="860" height="290" rx="18" fill="#fbfaf6"/><g font-size="17" font-weight="700" text-anchor="middle"><rect x="28" y="75" width="188" height="138" rx="14" fill="#e4f2ec"/><rect x="234" y="75" width="188" height="138" rx="14" fill="#fce9dc"/><rect x="440" y="75" width="188" height="138" rx="14" fill="#efebfa"/><rect x="646" y="75" width="188" height="138" rx="14" fill="#e4f2ec"/><text x="122" y="121" fill="#1d2b2a">01 曲率区间</text><text x="328" y="121" fill="#1d2b2a">02 精确步长</text><text x="534" y="121" fill="#1d2b2a">03 Armijo</text><text x="740" y="121" fill="#1d2b2a">04 Newton 方向</text></g><g text-anchor="middle" font-size="16"><text x="122" y="161" fill="#126e66">[1.8, 2.2]</text><text x="328" y="161" fill="#bd633f">α*=17/65</text><text x="534" y="161" fill="#7461ba">8 → 4 → 2</text><text x="740" y="161" fill="#126e66">3.5 → −4.25</text></g><text x="28" y="253" fill="#61716d" font-size="15">这些是不同问题的独立结论；不存在由左向右自动推出的逻辑链。</text></svg>