<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-labelledby="b-title b-desc"><title id="b-title">回溯线搜索的候选步缩短过程</title><desc id="b-desc">候选步 alpha 从 1 开始，Armijo 检查失败后缩短为 0.5，第二次检查通过。</desc><rect width="860" height="300" rx="18" fill="#fbfaf6"/><path d="M95 150H765" stroke="#9eaea5" stroke-width="4" stroke-linecap="round"/><g><circle cx="170" cy="150" r="24" fill="#f7e4dc" stroke="#bd633f" stroke-width="3"/><circle cx="430" cy="150" r="24" fill="#dff0e8" stroke="#126e66" stroke-width="3"/><circle cx="690" cy="150" r="24" fill="#e9e5f6" stroke="#7461ba" stroke-width="3"/></g><g fill="#1d2b2a" text-anchor="middle" font-size="20" font-weight="700"><text x="170" y="157">1.0</text><text x="430" y="157">0.5</text><text x="690" y="157">0.25</text></g><g fill="#61716d" text-anchor="middle" font-size="16"><text x="170" y="85">初始试探</text><text x="430" y="85">缩短一次</text><text x="690" y="85">若仍失败</text><text x="170" y="205" fill="#bd633f">拒绝</text><text x="430" y="205" fill="#126e66">通过</text><text x="690" y="205">停止或继续</text></g><path d="M205 150H393M465 150H653" stroke="#61716d" stroke-width="2" stroke-dasharray="7 6"/><path d="M382 140L397 150L382 160M642 140L657 150L642 160" fill="none" stroke="#61716d" stroke-width="2"/><text x="430" y="260" text-anchor="middle" fill="#1d2b2a" font-size="15">α ← ρ α，0 &lt; ρ &lt; 1；本例 ρ = 0.5</text></svg>