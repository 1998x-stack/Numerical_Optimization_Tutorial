<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="cgrate-title cgrate-desc">
<title id="cgrate-title">共轭梯度误差上界随迭代步数的收缩</title>
<desc id="cgrate-desc">纵轴是定理 5.3 的系数 2 乘以收缩因子 ρ 的 k 次幂，横轴是迭代步数。条件数 κ 越大，曲线下降越慢。</desc>
<rect width="640" height="340" rx="18" fill="#fbfaf6"/>
<g stroke="#e6dfd2" stroke-width="1">
<line x1="70" y1="40" x2="560" y2="40"/><line x1="70" y1="100" x2="560" y2="100"/>
<line x1="70" y1="160" x2="560" y2="160"/><line x1="70" y1="220" x2="560" y2="220"/>
<line x1="70" y1="280" x2="560" y2="280"/>
</g>
<line x1="70" y1="40" x2="70" y2="280" stroke="#263a33" stroke-width="1.5"/>
<line x1="70" y1="280" x2="560" y2="280" stroke="#263a33" stroke-width="1.5"/>
<g font-size="13" font-family="system-ui, sans-serif" fill="#5b6b64">
<text x="60" y="285" text-anchor="end">0</text><text x="60" y="225" text-anchor="end">0.5</text>
<text x="60" y="165" text-anchor="end">1.0</text><text x="60" y="105" text-anchor="end">1.5</text>
<text x="60" y="45" text-anchor="end">2.0</text>
<text x="70" y="300" text-anchor="middle">0</text><text x="217" y="300" text-anchor="middle">3</text>
<text x="364" y="300" text-anchor="middle">6</text><text x="511" y="300" text-anchor="middle">9</text>
</g>
<polyline fill="none" stroke="#bd633f" stroke-width="3" points="70.0,40.0 119.0,155.3 168.0,215.2 217.0,246.4 266.0,262.5 315.0,270.9 364.0,275.3 413.0,277.5 462.0,278.7 511.0,279.3 560.0,279.7"/>
<polyline fill="none" stroke="#3b5b9a" stroke-width="3" points="70.0,40.0 119.0,83.6 168.0,119.3 217.0,148.5 266.0,172.4 315.0,192.0 364.0,208.0 413.0,221.1 462.0,231.8 511.0,240.6 560.0,247.7"/>
<polyline fill="none" stroke="#126e66" stroke-width="3" points="70.0,40.0 119.0,238.8 168.0,272.9 217.0,278.8 266.0,279.8 315.0,280.0 364.0,280.0 413.0,280.0 462.0,280.0 511.0,280.0 560.0,280.0"/>
<g font-size="14" font-family="system-ui, sans-serif" fill="#263a33">
<line x1="392" y1="52" x2="420" y2="52" stroke="#126e66" stroke-width="3"/><text x="426" y="57">κ=2</text>
<line x1="392" y1="74" x2="420" y2="74" stroke="#bd633f" stroke-width="3"/><text x="426" y="79">κ=10</text>
<line x1="392" y1="96" x2="420" y2="96" stroke="#3b5b9a" stroke-width="3"/><text x="426" y="101">κ=100</text>
</g>
<text x="315" y="325" text-anchor="middle" font-size="14" font-family="system-ui, sans-serif" fill="#263a33">迭代步数 k</text>
<text x="88" y="30" font-size="14" font-family="system-ui, sans-serif" fill="#263a33">上界系数 2·ρᵏ（ρ=(√κ−1)/(√κ+1)）</text>
</svg>
