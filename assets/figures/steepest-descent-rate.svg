<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" role="img" aria-labelledby="s-title s-desc"><title id="s-title">最速下降在狭长二次等高线上的锯齿路径</title><desc id="s-desc">椭圆等高线围绕原点，最速下降迭代点在两侧交替，逐渐接近原点。</desc><rect width="860" height="340" rx="18" fill="#fbfaf6"/><g fill="none" stroke="#c7d5ce" stroke-width="2"><ellipse cx="390" cy="165" rx="330" ry="118"/><ellipse cx="390" cy="165" rx="260" ry="92"/><ellipse cx="390" cy="165" rx="185" ry="65"/><ellipse cx="390" cy="165" rx="110" ry="39"/><ellipse cx="390" cy="165" rx="38" ry="14"/></g><path d="M710 45L200 275L555 85L300 235L470 120L350 205L420 145L385 177" fill="none" stroke="#bd633f" stroke-width="4" stroke-linejoin="round"/><g fill="#126e66"><circle cx="710" cy="45" r="7"/><circle cx="200" cy="275" r="7"/><circle cx="555" cy="85" r="7"/><circle cx="300" cy="235" r="7"/><circle cx="470" cy="120" r="7"/><circle cx="350" cy="205" r="7"/><circle cx="420" cy="145" r="7"/><circle cx="385" cy="177" r="7"/></g><circle cx="390" cy="165" r="6" fill="#7461ba"/><g fill="#1d2b2a" font-size="15"><text x="715" y="34">x₀</text><text x="402" y="158">x*</text><text x="60" y="315" fill="#61716d">狭长等高线使最速下降路径反复横穿谷底</text></g></svg>