<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 324" role="img" aria-labelledby="title desc"><title id="title">椭球信赖域经坐标缩放成为圆</title><desc id="desc">D 等于 diag(10,1) 时，p 原坐标的可行域为横向窄纵向长的椭圆；q=Dp 后同样的可行集合映射为标准圆。</desc><rect width="860" height="324" rx="18" fill="#fbfaf6"/><g fill="#263a33" font-size="19" font-weight="700"><text x="42" y="45">原坐标 p：‖Dp‖≤1</text><text x="512" y="45">新坐标 q：‖q‖≤1</text></g><path d="M225 65V285M122 173H328M638 65V285M515 173H770" stroke="#a5b8ae" stroke-width="2"/><ellipse cx="225" cy="173" rx="25" ry="97" stroke="#126e66" stroke-width="3" fill="#e5f3ec"/><circle cx="638" cy="173" r="98" stroke="#126e66" stroke-width="3" fill="#e5f3ec"/><path d="M344 173H474m-12-9 12 9-12 9" stroke="#b76548" stroke-width="4" fill="none"/><text x="368" y="150" font-size="18" fill="#a65539">q=Dp</text><g fill="#637570" font-size="16"><text x="166" y="309">敏感方向压缩</text><text x="561" y="309">标准 Euclidean 球</text></g></svg>