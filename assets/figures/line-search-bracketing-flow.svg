<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-labelledby="title desc"><title id="title">搜索线上的两个阶段</title><desc id="desc">初始试探确定是否可接受，失败时扩展或括住候选区间，再在该区间中缩小范围选择步长。</desc><rect width="860" height="300" rx="18" fill="#fbfaf6"/><text x="35" y="46" font-size="20" font-weight="700" fill="#263a33">搜索线上的两个阶段</text><text x="35" y="70" font-size="14" fill="#63756f">线搜索不是只做一次缩短：还会根据斜率信息建立区间</text><rect x="28" y="92" width="188" height="124" rx="14" fill="#e4f2ec" stroke="#176e62" stroke-opacity=".35"/><text x="122" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">初始候选</text><text x="122" y="166" text-anchor="middle" font-size="16" fill="#176e62">α₀ ＞ 0</text><text x="122" y="192" text-anchor="middle" font-size="13" fill="#61716d">利用历史信息</text><rect x="235" y="92" width="188" height="124" rx="14" fill="#fce9dc" stroke="#a45435" stroke-opacity=".35"/><text x="329" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">计算 φ</text><text x="329" y="166" text-anchor="middle" font-size="16" fill="#a45435">函数值与斜率</text><text x="329" y="192" text-anchor="middle" font-size="13" fill="#61716d">检查下降</text><rect x="442" y="92" width="188" height="124" rx="14" fill="#efebfa" stroke="#6451a0" stroke-opacity=".35"/><text x="536" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">括区间</text><text x="536" y="166" text-anchor="middle" font-size="16" fill="#6451a0">发现方向或函数值转变</text><text x="536" y="192" text-anchor="middle" font-size="13" fill="#61716d">保留候选范围</text><rect x="649" y="92" width="188" height="124" rx="14" fill="#e4f2ec" stroke="#176e62" stroke-opacity=".35"/><text x="743" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">缩小范围</text><text x="743" y="166" text-anchor="middle" font-size="16" fill="#176e62">插值或二分</text><text x="743" y="192" text-anchor="middle" font-size="13" fill="#61716d">验证终止准则</text><path d="M218 154h14m-5-6 6 6-6 6" stroke="#657a72" stroke-width="2.4" fill="none"/><path d="M425 154h14m-5-6 6 6-6 6" stroke="#657a72" stroke-width="2.4" fill="none"/><path d="M632 154h14m-5-6 6 6-6 6" stroke="#657a72" stroke-width="2.4" fill="none"/><text x="35" y="267" font-size="14" fill="#61716d">严格强 Wolfe 搜索还须逐次检查 Armijo 与方向导数</text></svg>