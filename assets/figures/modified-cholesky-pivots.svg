<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-labelledby="title desc"><title id="title">正定分解的第二个主元失效，再加修正</title><desc id="desc">二维不定矩阵的 LDL 主元为 1 和负 3；把第二主元提高到正 0.5，重建矩阵变正定。</desc><rect width="860" height="300" rx="18" fill="#fbfaf6"/><text x="35" y="46" font-size="20" font-weight="700" fill="#263a33">正定分解的第二个主元失效，再加修正</text><text x="35" y="70" font-size="14" fill="#63756f">修正发生在分解过程中，而非完成不稳定分解后再补救</text><rect x="28" y="92" width="188" height="124" rx="14" fill="#e4f2ec" stroke="#176e62" stroke-opacity=".35"/><text x="122" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">原矩阵 H</text><text x="122" y="166" text-anchor="middle" font-size="16" fill="#176e62">[[1,2],[2,1]]</text><text x="122" y="192" text-anchor="middle" font-size="13" fill="#61716d">不定</text><rect x="235" y="92" width="188" height="124" rx="14" fill="#fce9dc" stroke="#a45435" stroke-opacity=".35"/><text x="329" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">计算主元</text><text x="329" y="166" text-anchor="middle" font-size="16" fill="#a45435">d₁=1，c₂₂=−3</text><text x="329" y="192" text-anchor="middle" font-size="13" fill="#61716d">第二主元失败</text><rect x="442" y="92" width="188" height="124" rx="14" fill="#efebfa" stroke="#6451a0" stroke-opacity=".35"/><text x="536" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">修正主元</text><text x="536" y="166" text-anchor="middle" font-size="16" fill="#6451a0">d₂=0.5</text><text x="536" y="192" text-anchor="middle" font-size="13" fill="#61716d">保障正定</text><rect x="649" y="92" width="188" height="124" rx="14" fill="#e4f2ec" stroke="#176e62" stroke-opacity=".35"/><text x="743" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">重建 B</text><text x="743" y="166" text-anchor="middle" font-size="16" fill="#176e62">[[1,2],[2,4.5]]</text><text x="743" y="192" text-anchor="middle" font-size="13" fill="#61716d">det(B)=0.5＞0</text><path d="M218 154h14m-5-6 6 6-6 6" stroke="#657a72" stroke-width="2.4" fill="none"/><path d="M425 154h14m-5-6 6 6-6 6" stroke="#657a72" stroke-width="2.4" fill="none"/><path d="M632 154h14m-5-6 6 6-6 6" stroke="#657a72" stroke-width="2.4" fill="none"/><text x="35" y="267" font-size="14" fill="#61716d">示例 L=[[1,0],[2,1]]，D=diag(1,0.5)</text></svg>