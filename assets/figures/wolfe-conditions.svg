<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="w-title w-desc"><title id="w-title">Wolfe 条件的函数值与斜率约束</title><desc id="w-desc">左图显示 Armijo 充分下降线与目标函数曲线；右图显示弱 Wolfe 的单侧斜率阈值和强 Wolfe 的双侧阈值。</desc><rect width="860" height="330" rx="18" fill="#fbfaf6"/><g stroke="#b8c6bf" stroke-width="2" fill="none"><path d="M62 34V260H390"/><path d="M472 34V260H818"/></g><g fill="#61716d" font-size="15"><text x="68" y="24">φ(α)</text><text x="355" y="286">α</text><text x="478" y="24">φ′(α)</text><text x="790" y="286">α</text></g><path d="M85 72 Q170 250 258 230 T374 68" fill="none" stroke="#126e66" stroke-width="5"/><path d="M85 72 L374 150" fill="none" stroke="#bd633f" stroke-width="3" stroke-dasharray="8 6"/><circle cx="238" cy="219" r="6" fill="#126e66"/><path d="M238 219V258" stroke="#126e66" stroke-dasharray="4 4"/><g fill="#1d2b2a" font-size="15"><text x="92" y="55">起点</text><text x="249" y="211">局部低谷</text><text x="104" y="150" fill="#bd633f">Armijo 上界</text></g><path d="M500 178H795" stroke="#9baaa2" stroke-width="2"/><path d="M500 218H795" stroke="#bd633f" stroke-width="3" stroke-dasharray="7 5"/><path d="M500 138H795" stroke="#7461ba" stroke-width="3" stroke-dasharray="7 5"/><path d="M500 98H795" stroke="#126e66" stroke-width="4"/><circle cx="645" cy="178" r="6" fill="#126e66"/><g fill="#1d2b2a" font-size="15"><text x="510" y="88">初始斜率 φ′(0)</text><text x="510" y="132" fill="#7461ba">强 Wolfe 上界</text><text x="510" y="212" fill="#bd633f">强 Wolfe 下界</text><text x="657" y="170">可接受斜率带</text><text x="510" y="306" font-size="13" fill="#61716d">弱 Wolfe 只要求斜率不低于下阈值</text></g></svg>