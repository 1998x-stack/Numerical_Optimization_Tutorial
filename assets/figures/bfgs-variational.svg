<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-labelledby="bfgs-variational-title bfgs-variational-desc"><title id="bfgs-variational-title">在所有满足割线方程的对称矩阵中取离 Bₖ 最近者</title><desc id="bfgs-variational-desc">左图用二维示意：割线约束 Bs=y 是一条仿射线，Bₖ 到这条线的最短投影就是 BFGS 更新 Bₖ₊₁；右侧说明 BFGS 与 DFP 在同一约束下的对偶关系。</desc><rect width="680" height="320" rx="16" fill="#f7f4ee"/><line x1="70" y1="250" x2="330" y2="250" stroke="#e0d9cb" stroke-width="1.5"/><line x1="90" y1="50" x2="90" y2="280" stroke="#e0d9cb" stroke-width="1.5"/><line x1="110" y1="70" x2="320" y2="230" stroke="#bd633f" stroke-width="3" stroke-dasharray="8 6"/><circle cx="150" cy="150" r="7" fill="#263a33"/><line x1="150" y1="150" x2="270" y2="214" stroke="#126e66" stroke-width="4"/><circle cx="270" cy="214" r="7" fill="#126e66"/><g fill="#263a33" font-size="16" font-family="system-ui, sans-serif"><text x="105" y="140">Bₖ</text><text x="278" y="220" fill="#126e66">Bₖ₊₁</text><text x="130" y="60" fill="#bd633f">约束 Bs=y 的解流形</text><text x="190" y="175" fill="#126e66">最短改变</text></g><g fill="#263a33" font-size="16" font-family="system-ui, sans-serif"><text x="380" y="90">同一组 s, y：</text><text x="380" y="125">BFGS 让 Hessian 近似</text><text x="380" y="155">在 B 空间做最小改变；</text><text x="380" y="185">DFP 让 H = B⁻¹ 在</text><text x="380" y="215">逆空间做最小改变。</text><text x="380" y="255" fill="#bd633f">两者都满足割线方程。</text></g></svg>