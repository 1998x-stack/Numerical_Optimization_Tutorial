<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="title desc"><title id="title">信赖域全局最优证书的两个非负部分</title><desc id="desc">在球内任意点 v 与证书步 p 星之间的模型差异可分成半正定修正曲率项与互补半径项，二者都非负。</desc><rect width="860" height="330" rx="18" fill="#fbfaf6"/><text x="35" y="49" font-size="21" font-weight="700" fill="#203a35">q(v) − q(p*) ≥ 0</text><rect x="35" y="86" width="358" height="146" rx="16" fill="#e4f2ec"/><rect x="459" y="86" width="358" height="146" rx="16" fill="#fce9dc"/><g fill="#24433a" font-size="18"><text x="56" y="124" font-weight="700">半正定曲率项</text><text x="56" y="163">½ dᵀ(B+λI)d</text><text x="56" y="197" font-size="16">B+λI ⪰ 0 ⇒ 非负</text><text x="480" y="124" font-weight="700">互补半径项</text><text x="480" y="163">λ/2 · (Δ²−‖v‖²)</text><text x="480" y="197" font-size="16">λ≥0 且 ‖v‖≤Δ ⇒ 非负</text></g><text x="35" y="290" font-size="15" fill="#657770">两个项共同建立全局性，不要求 B 本身正定</text></svg>