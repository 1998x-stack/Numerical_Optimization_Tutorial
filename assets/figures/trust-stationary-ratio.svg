<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="title desc"><title id="title">信赖域模型质量比的两种接受准则</title><desc id="desc">同一次候选步产生预测下降与实际下降，计算 rho。eta=0 与固定正 eta 对真实下降的要求不同，前者产生较弱的序列收敛结论。</desc><rect width="860" height="330" rx="18" fill="#fbfaf6"/><text x="40" y="44" font-size="21" fill="#203d36" font-weight="700">一个候选步，两种下降量</text><rect x="40" y="83" width="300" height="66" rx="12" fill="#e3f1eb"/><rect x="40" y="168" width="300" height="66" rx="12" fill="#fceada"/><g font-size="18" fill="#1b443b"><text x="60" y="110">模型预测：0.425</text><text x="60" y="194">真实下降：0.46875</text><text x="60" y="134" font-size="14">m(0) − m(p)</text><text x="60" y="218" font-size="14">f(x) − f(x+p)</text></g><path d="M345 155L433 155m-10-8 10 8-10 8" fill="none" stroke="#72968d" stroke-width="3"/><rect x="445" y="102" width="355" height="126" rx="14" fill="#eeebfa"/><g fill="#282d3f" font-size="19"><text x="465" y="139" font-weight="700">ρ = 1.10294</text><text x="465" y="177">η=0：只需真实下降</text><text x="465" y="204">η&gt;0：需达到固定比例</text></g><text x="40" y="288" font-size="15" fill="#63746f">示例为单轮结果，不等价于全局收敛定理</text></svg>