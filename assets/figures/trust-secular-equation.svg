<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="title desc"><title id="title">信赖域 secular 曲线的交点</title><desc id="desc">随着 lambda 增大，正定二维二次模型的 p(lambda) 范数下降，并在 lambda 约 0.631 与 Delta=1.3 相交。</desc><rect width="860" height="330" rx="18" fill="#fbfaf6"/><path d="M90 37v241h685" stroke="#62766e" stroke-width="2.5" fill="none"/><text x="36" y="51" font-size="16" fill="#243a34">‖p(λ)‖</text><text x="735" y="304" font-size="16" fill="#243a34">λ</text><path d="M90 61 C180 113 220 165 334 198 S560 241 750 267" fill="none" stroke="#126e66" stroke-width="5"/><path d="M90 197H775" stroke="#bd633f" stroke-width="2.5" stroke-dasharray="8 6"/><path d="M334 197V279" stroke="#818b95" stroke-dasharray="5 5" stroke-width="2"/><circle cx="334" cy="197" r="9" fill="#126e66" stroke="#fff" stroke-width="3"/><text x="108" y="183" font-size="17" fill="#ad573b">Δ=1.3</text><text x="295" y="296" font-size="16" fill="#236459">λ*≈0.631</text><text x="505" y="87" font-size="17" fill="#236459">更大的 λ → 更小的步长</text></svg>