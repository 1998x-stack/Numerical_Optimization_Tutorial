<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="title desc"><title id="title">Hard Case：零空间补足球面半径</title><desc id="desc">在二维信赖域球内，最小范数解位于 x=0 y=-1/3，两个全局最优点位于圆的左右边界，x=正负sqrt(35)/3。</desc><rect width="860" height="330" rx="18" fill="#fbfaf6"/><circle cx="310" cy="151" r="126" fill="#e5f1ec" stroke="#91bcb0" stroke-width="2.5"/><path d="M156 151H464M310 23V280" stroke="#b5c9c3" stroke-width="2"/><path d="M310 174H186M310 174H434" stroke="#b46a50" stroke-dasharray="7 5" stroke-width="3"/><circle cx="310" cy="174" r="9" fill="#7a69a4"/><circle cx="186" cy="174" r="10" fill="#126e66"/><circle cx="434" cy="174" r="10" fill="#126e66"/><text x="29" y="44" font-size="20" fill="#263934" font-weight="700">B = diag(−2, 1)，g = (0, 1)</text><g fill="#263934" font-size="17"><text x="519" y="112">λ*=2，B+λI 半正定</text><text x="519" y="158">y=−1/3 固定</text><text x="519" y="207">x=±√35/3 补足球面</text><text x="519" y="250" font-size="15" fill="#63746f">两个全局最优点，模型值均为 −25/6</text></g></svg>