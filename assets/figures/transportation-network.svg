<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">两座工厂到三个零售点的运输网络</title><desc id="desc">工厂 A 和 B 分别向零售点 X、Y、Z 发货。六条连线的数字分别为单位运输成本 4、6、8、5、4、3，节点旁标注供给量和需求量。</desc>
<rect width="900" height="430" rx="18" fill="#fff"/>
<g stroke="#9bb9ad" stroke-width="3" fill="none"><path d="M220 125L650 90M220 125L650 215M220 125L650 340M220 305L650 90M220 305L650 215M220 305L650 340"/></g>
<g stroke="#126e66" stroke-width="5" fill="none" stroke-linecap="round"><path d="M220 125L650 90M220 125L650 215M220 305L650 215M220 305L650 340"/></g>
<g fill="#fff" stroke="#126e66" stroke-width="4"><circle cx="220" cy="125" r="48"/><circle cx="220" cy="305" r="48"/><circle cx="650" cy="90" r="40"/><circle cx="650" cy="215" r="40"/><circle cx="650" cy="340" r="40"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#1d2b2a"><text x="220" y="133" font-size="27" font-weight="700">A</text><text x="220" y="313" font-size="27" font-weight="700">B</text><text x="650" y="98" font-size="24" font-weight="700">X</text><text x="650" y="223" font-size="24" font-weight="700">Y</text><text x="650" y="348" font-size="24" font-weight="700">Z</text></g>
<g font-family="Arial,sans-serif" fill="#53676d" font-size="16"><text x="220" y="54" text-anchor="middle">供给 35</text><text x="220" y="386" text-anchor="middle">供给 25</text><text x="650" y="36" text-anchor="middle">需求 20</text><text x="650" y="275" text-anchor="middle">需求 25</text><text x="650" y="408" text-anchor="middle">需求 15</text></g>
<g font-family="Arial,sans-serif" fill="#1d2b2a" font-size="17" font-weight="700">
<rect x="395" y="68" width="52" height="30" rx="8" fill="#fff"/><text x="421" y="89" text-anchor="middle">4</text>
<rect x="410" y="150" width="52" height="30" rx="8" fill="#fff"/><text x="436" y="171" text-anchor="middle">6</text>
<rect x="395" y="220" width="52" height="30" rx="8" fill="#fff"/><text x="421" y="241" text-anchor="middle">8</text>
<rect x="445" y="182" width="52" height="30" rx="8" fill="#fff"/><text x="471" y="203" text-anchor="middle">5</text>
<rect x="395" y="255" width="52" height="30" rx="8" fill="#fff"/><text x="421" y="276" text-anchor="middle">4</text>
<rect x="420" y="330" width="52" height="30" rx="8" fill="#fff"/><text x="446" y="351" text-anchor="middle">3</text>
</g>
<g font-family="Arial,sans-serif" font-size="16" fill="#53676d"><text x="70" y="210">工厂</text><text x="760" y="210">零售点</text><text x="450" y="405" text-anchor="middle">灰色连线：可选运输路线；数字：单位运输成本</text></g>
</svg>