<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" role="img" aria-labelledby="title desc"><title id="title">Cauchy 模型下降与理论下界</title><desc id="desc">当信赖域半径为 0.2 时，下降为 0.32、下界为 0.2；当半径为 1 时二者均为 0.5。</desc><rect width="860" height="290" rx="18" fill="#fbfaf6"/><g fill="#263a33" font-size="18"><text x="40" y="55">Δ=0.2</text><text x="40" y="162">Δ=1</text></g><rect x="162" y="36" width="292" height="31" rx="5" fill="#126e66"/><rect x="162" y="73" width="182" height="22" rx="5" fill="#bd633f"/><rect x="162" y="143" width="456" height="31" rx="5" fill="#126e66"/><rect x="162" y="180" width="456" height="22" rx="5" fill="#bd633f"/><g fill="#263a33" font-size="16"><text x="470" y="58">0.32</text><text x="357" y="92">0.20</text><text x="631" y="167">0.50</text><text x="631" y="199">0.50</text><text x="40" y="260" font-size="15" fill="#61716d">绿色：Cauchy 模型下降　砖色：理论保证下界</text></g></svg>