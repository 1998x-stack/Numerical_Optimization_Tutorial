<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-labelledby="title desc"><title id="title">不同特征方向，进行不同程度的修正</title><desc id="desc">H 的特征值为 3 和负 1，裁剪后变为 3 和正阈值 δ；方向的坐标轴保持不变。</desc><rect width="860" height="300" rx="18" fill="#fbfaf6"/><text x="35" y="46" font-size="20" font-weight="700" fill="#263a33">不同特征方向，进行不同程度的修正</text><text x="35" y="70" font-size="14" fill="#63756f">只提高小特征值，正曲率特征值不必改动</text><rect x="28" y="92" width="188" height="124" rx="14" fill="#e4f2ec" stroke="#176e62" stroke-opacity=".35"/><text x="122" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">原谱</text><text x="122" y="166" text-anchor="middle" font-size="16" fill="#176e62">−1 与 3</text><text x="122" y="192" text-anchor="middle" font-size="13" fill="#61716d">含负曲率</text><rect x="235" y="92" width="188" height="124" rx="14" fill="#fce9dc" stroke="#a45435" stroke-opacity=".35"/><text x="329" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">设阈值</text><text x="329" y="166" text-anchor="middle" font-size="16" fill="#a45435">δ ＞ 0</text><text x="329" y="192" text-anchor="middle" font-size="13" fill="#61716d">控制最小曲率</text><rect x="442" y="92" width="188" height="124" rx="14" fill="#efebfa" stroke="#6451a0" stroke-opacity=".35"/><text x="536" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">逐项裁剪</text><text x="536" y="166" text-anchor="middle" font-size="16" fill="#6451a0">max(λ,δ)</text><text x="536" y="192" text-anchor="middle" font-size="13" fill="#61716d">保留特征向量</text><rect x="649" y="92" width="188" height="124" rx="14" fill="#e4f2ec" stroke="#176e62" stroke-opacity=".35"/><text x="743" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">得到 B</text><text x="743" y="166" text-anchor="middle" font-size="16" fill="#176e62">谱全部正</text><text x="743" y="192" text-anchor="middle" font-size="13" fill="#61716d">求解 Bp=−g</text><path d="M218 154h14m-5-6 6 6-6 6" stroke="#657a72" stroke-width="2.4" fill="none"/><path d="M425 154h14m-5-6 6 6-6 6" stroke="#657a72" stroke-width="2.4" fill="none"/><path d="M632 154h14m-5-6 6 6-6 6" stroke="#657a72" stroke-width="2.4" fill="none"/><text x="35" y="267" font-size="14" fill="#61716d">示例 H=[[1,2],[2,1]]，原特征值为 −1、3</text></svg>