<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-labelledby="bfgs-global-title bfgs-global-desc"><title id="bfgs-global-title">水平集假设的作用</title><desc id="bfgs-global-desc">左侧凸水平集下椭球嵌套、梯度方向受控；右侧非凸水平集下存在多个驻点与平坦区域，lim inf 结论仍成立但无法定位全局最小。</desc><rect width="680" height="300" rx="16" fill="#f7f4ee"/><g transform="translate(150,150)"><ellipse rx="100" ry="60" fill="none" stroke="#7fbcb0" stroke-width="2"/><ellipse rx="65" ry="40" fill="none" stroke="#126e66" stroke-width="2"/><circle r="5" fill="#126e66"/></g><g transform="translate(490,150)"><ellipse rx="110" ry="65" fill="none" stroke="#e0c7a6" stroke-width="2"/><ellipse rx="70" ry="55" fill="none" stroke="#bd633f" stroke-width="2"/><ellipse rx="40" ry="20" fill="none" stroke="#bd633f" stroke-width="2"/><circle cx="-40" cy="10" r="5" fill="#263a33"/><circle cx="35" cy="-8" r="5" fill="#263a33"/><circle cx="5" cy="25" r="5" fill="#bd633f"/></g><g font-size="15" font-family="system-ui, sans-serif" fill="#263a33"><text x="70" y="280">凸水平集：条件数可控</text><text x="395" y="280">非凸：多个驻点/平坦区</text></g></svg>