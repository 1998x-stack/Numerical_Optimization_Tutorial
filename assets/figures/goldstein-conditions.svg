<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="g-title g-desc"><title id="g-title">Goldstein 函数值夹逼</title><desc id="g-desc">图中两条下降直线形成函数值可接受带，过短步长落在上界之外，过度下降的点落在下界之外。</desc><rect width="860" height="330" rx="18" fill="#fbfaf6"/><path d="M80 36V270H800" stroke="#aab8b0" stroke-width="2" fill="none"/><path d="M100 80L760 205" stroke="#bd633f" stroke-width="3" stroke-dasharray="8 6"/><path d="M100 80L760 130" stroke="#7461ba" stroke-width="3" stroke-dasharray="8 6"/><path d="M100 80Q260 250 390 185T760 150" stroke="#126e66" stroke-width="5" fill="none"/><path d="M100 80L760 130L760 205Z" fill="#d9eee6" opacity=".55"/><circle cx="390" cy="185" r="7" fill="#126e66"/><circle cx="660" cy="175" r="7" fill="#bd633f"/><g fill="#1d2b2a" font-size="16"><text x="92" y="26">φ(α)</text><text x="770" y="295">α</text><text x="510" y="113" fill="#7461ba">上界：下降不能太少</text><text x="510" y="225" fill="#bd633f">下界：下降不能过度</text><text x="400" y="170">可接受区域</text><text x="655" y="158" fill="#bd633f">示意点</text><text x="105" y="300" font-size="13" fill="#61716d">示意图只表达函数值带；实际曲线由具体目标函数决定</text></g></svg>