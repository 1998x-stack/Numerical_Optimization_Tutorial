<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="fig-title fig-desc"><title id="fig-title">步长把方向转化为实际移动距离</title><desc id="fig-desc">一维线搜索沿固定方向 p=4 观察 phi(alpha)；初始步长一不满足 Armijo，回溯到零点五后到达最小值。</desc><rect width="900" height="430" rx="18" fill="#fffdf9"/>
<g stroke="#e7ece7" stroke-width="1"><path d="M95 335H820M95 55V335M240 55V335M385 55V335M530 55V335M675 55V335"/></g>
<path d="M120 75 Q450 595 780 75" fill="none" stroke="#127164" stroke-width="5"/>
<path d="M120 75L450 335" fill="none" stroke="#bd633f" stroke-width="3" stroke-dasharray="7 6"/>
<circle cx="120" cy="75" r="8" fill="#bd633f"/><circle cx="450" cy="335" r="8" fill="#127164"/><circle cx="780" cy="75" r="8" fill="#bd633f"/>
<text x="120" y="48" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#bd633f" font-size="16" font-weight="700" text-anchor="start">α=0：φ(0)=4</text>
<text x="450" y="365" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#127164" font-size="16" font-weight="700" text-anchor="middle">α=0.5：φ=0</text>
<text x="780" y="48" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#bd633f" font-size="16" font-weight="700" text-anchor="end">α=1：φ=4</text>
<text x="450" y="405" font-family="Arial,'Microsoft YaHei',sans-serif" fill="#53676d" font-size="15" font-weight="400" text-anchor="middle">从 x₀=0 沿 p=4 前进；回溯缩短 α，直到充分下降条件成立</text>
</svg>