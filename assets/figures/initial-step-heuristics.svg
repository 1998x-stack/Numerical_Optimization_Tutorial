<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-labelledby="title desc"><title id="title">从上一轮下降信息预测下一次的初始步长</title><desc id="desc">上一轮的 α、方向导数与当前方向导数给出尺度比；这个比值用于提议候选步，不保证满足 Wolfe 条件。</desc><rect width="860" height="300" rx="18" fill="#fbfaf6"/><text x="35" y="46" font-size="20" font-weight="700" fill="#263a33">从上一轮下降信息预测下一次的初始步长</text><text x="35" y="70" font-size="14" fill="#63756f">区分初始试探与最终接受步长</text><rect x="28" y="92" width="188" height="124" rx="14" fill="#e4f2ec" stroke="#176e62" stroke-opacity=".35"/><text x="122" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">上轮已知</text><text x="122" y="166" text-anchor="middle" font-size="16" fill="#176e62">α_prev、d_prev</text><text x="122" y="192" text-anchor="middle" font-size="13" fill="#61716d">实际下降尺度</text><rect x="235" y="92" width="188" height="124" rx="14" fill="#fce9dc" stroke="#a45435" stroke-opacity=".35"/><text x="329" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">本轮已知</text><text x="329" y="166" text-anchor="middle" font-size="16" fill="#a45435">d_now＜0</text><text x="329" y="192" text-anchor="middle" font-size="13" fill="#61716d">新搜索方向</text><rect x="442" y="92" width="188" height="124" rx="14" fill="#efebfa" stroke="#6451a0" stroke-opacity=".35"/><text x="536" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">估计步长</text><text x="536" y="166" text-anchor="middle" font-size="16" fill="#6451a0">α₀=α_prev d_prev/d_now</text><text x="536" y="192" text-anchor="middle" font-size="13" fill="#61716d">必要时截断</text><rect x="649" y="92" width="188" height="124" rx="14" fill="#e4f2ec" stroke="#176e62" stroke-opacity=".35"/><text x="743" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">检查条件</text><text x="743" y="166" text-anchor="middle" font-size="16" fill="#176e62">Armijo / Wolfe</text><text x="743" y="192" text-anchor="middle" font-size="13" fill="#61716d">失败则重新搜索</text><path d="M218 154h14m-5-6 6 6-6 6" stroke="#657a72" stroke-width="2.4" fill="none"/><path d="M425 154h14m-5-6 6 6-6 6" stroke="#657a72" stroke-width="2.4" fill="none"/><path d="M632 154h14m-5-6 6 6-6 6" stroke="#657a72" stroke-width="2.4" fill="none"/><text x="35" y="267" font-size="14" fill="#61716d">α₀ = α_prev · d_prev / d_now，负方向导数时比值为正</text></svg>