<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="broyden-det-title broyden-det-desc"><title id="broyden-det-title">det B₁ 随参数 φ 的变化</title><desc id="broyden-det-desc">直线 det=1+4φ；与横轴交于 φ=−1/4，左侧为不定，右侧为正定；φ=0 对应 BFGS，φ=1 对应 DFP。</desc><rect width="640" height="320" rx="16" fill="#f7f4ee"/><line x1="80" y1="240" x2="600" y2="240" stroke="#263a33" stroke-width="2"/><line x1="240" y1="50" x2="240" y2="290" stroke="#263a33" stroke-width="2"/><line x1="120" y1="300" x2="580" y2="60" stroke="#126e66" stroke-width="4"/><text x="580" y="262" font-size="15" font-family="system-ui, sans-serif">φ</text><text x="250" y="45" font-size="15" font-family="system-ui, sans-serif">det</text><circle cx="240" cy="200" r="6" fill="#bd633f"/><circle cx="320" cy="150" r="6" fill="#126e66"/><text x="150" y="120" font-size="14" fill="#bd633f" font-family="system-ui, sans-serif">φ&lt;−1/4: det&lt;0（不定）</text><text x="330" y="110" font-size="14" fill="#126e66" font-family="system-ui, sans-serif">φ≥0: det&gt;0</text><text x="238" y="220" font-size="13" font-family="system-ui, sans-serif">−1/4</text><text x="300" y="175" font-size="13" font-family="system-ui, sans-serif">BFGS (φ=0)</text><text x="330" y="140" font-size="13" font-family="system-ui, sans-serif">DFP (φ=1)</text></svg>