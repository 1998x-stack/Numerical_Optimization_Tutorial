<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" role="img" aria-labelledby="title desc"><title id="title">浮点表示间距随数值尺度增加</title><desc id="desc">左侧较小的数值尺度有密集可表示点，移动 1 可形成新数；右侧更大尺度浮点间距变宽，移动 1 仍处于同一个表示点。</desc><rect width="860" height="290" rx="18" fill="#fbfaf6"/><path d="M70 122H410M470 122H812" stroke="#9cafaa" stroke-width="3"/><g fill="#126e66"><circle cx="92" cy="122" r="6"/><circle cx="122" cy="122" r="6"/><circle cx="152" cy="122" r="6"/><circle cx="182" cy="122" r="6"/><circle cx="212" cy="122" r="6"/><circle cx="242" cy="122" r="6"/><circle cx="272" cy="122" r="6"/></g><g fill="#bd633f"><circle cx="500" cy="122" r="7"/><circle cx="640" cy="122" r="7"/><circle cx="780" cy="122" r="7"/></g><path d="M122 98L152 98m-7-5 7 5-7 5" stroke="#126e66" stroke-width="3" fill="none"/><path d="M500 98L528 98" stroke="#bd633f" stroke-width="3"/><g fill="#1d2b2a" font-size="18"><text x="75" y="52">数值较小：表示点密集</text><text x="472" y="52">数值很大：表示点稀疏</text><text x="82" y="173">+1 可以改变存储值</text><text x="492" y="173">+1 可能仍等于原值</text><text x="76" y="243" fill="#61716d" font-size="15">示意：浮点间距的相对变化；不是严格按比例的位模式图</text></g></svg>