<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="fr-title fr-desc" font-family="system-ui, sans-serif">
  <title id="fr-title">Fletcher–Reeves 方向由负梯度与先前方向相加而成</title>
  <desc id="fr-desc">在点 x_{k+1} 处，负梯度向量与按 β_k 缩放的先前方向 p_k 相加，得到新方向 p_{k+1}。</desc>
  <rect width="640" height="360" rx="16" fill="#f7f4ee"/>
  <line x1="70" y1="320" x2="600" y2="320" stroke="#e0d9cb" stroke-width="1.5"/>
  <line x1="90" y1="40" x2="90" y2="330" stroke="#e0d9cb" stroke-width="1.5"/>
  <text x="556" y="342" fill="#8a8377" font-size="15">x₁</text>
  <text x="70" y="52" fill="#8a8377" font-size="15">x₂</text>
  <line x1="120" y1="300" x2="200" y2="240" stroke="#126e66" stroke-width="4" stroke-dasharray="8 6"/>
  <line x1="200" y1="240" x2="290" y2="160" stroke="#c9772f" stroke-width="4"/>
  <line x1="290" y1="160" x2="330" y2="130" stroke="#7a4fa3" stroke-width="5"/>
  <line x1="200" y1="240" x2="330" y2="130" stroke="#263a33" stroke-width="4"/>
  <line x1="290" y1="160" x2="290" y2="240" stroke="#c9c2b3" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="330" y1="130" x2="330" y2="160" stroke="#c9c2b3" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="290" y1="160" x2="330" y2="160" stroke="#c9c2b3" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="120" cy="300" r="6" fill="#263a33"/>
  <circle cx="200" cy="240" r="7" fill="#126e66"/>
  <circle cx="330" cy="130" r="6" fill="#7a4fa3"/>
  <g font-size="16" fill="#263a33">
    <text x="78" y="318">x_k</text>
    <text x="150" y="262" fill="#126e66">p_k</text>
    <text x="222" y="228" fill="#126e66">x_{k+1}</text>
    <text x="300" y="152" fill="#c9772f">−g_{k+1}</text>
    <text x="296" y="118" fill="#7a4fa3">β_k p_k</text>
    <text x="336" y="196" fill="#263a33">p_{k+1}</text>
  </g>
  <text x="90" y="34" fill="#8a8377" font-size="15">p_{k+1} = −g_{k+1} + β_k p_k</text>
</svg>
