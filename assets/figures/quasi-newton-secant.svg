<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" role="img" aria-labelledby="q-title q-desc"><title id="q-title">拟 Newton 的割线信息与矩阵更新</title><desc id="q-desc">相邻点 xk 与 xk+1 产生位移 s 和梯度差 y，BFGS 用这对向量更新 Hessian 近似矩阵。</desc><rect width="860" height="320" rx="18" fill="#fbfaf6"/><rect x="45" y="95" width="180" height="130" rx="14" fill="#e6f2ed" stroke="#b8d4c8"/><rect x="330" y="95" width="190" height="130" rx="14" fill="#f8ece5" stroke="#e5c6b6"/><rect x="630" y="95" width="185" height="130" rx="14" fill="#eeeaf8" stroke="#cfc7e8"/><g fill="#1d2b2a" text-anchor="middle"><text x="135" y="130" font-size="20" font-weight="700">相邻迭代</text><text x="135" y="165" font-size="17">sₖ = xₖ₊₁ − xₖ</text><text x="135" y="195" font-size="17">yₖ = gₖ₊₁ − gₖ</text><text x="425" y="130" font-size="20" font-weight="700">割线条件</text><text x="425" y="173" font-size="22">Bₖ₊₁ sₖ = yₖ</text><text x="722" y="130" font-size="20" font-weight="700">曲率更新</text><text x="722" y="171" font-size="18">BFGS</text><text x="722" y="198" font-size="14">对称 · 正定</text></g><path d="M225 160H320M520 160H620" stroke="#126e66" stroke-width="4"/><path d="M307 150L322 160L307 170M607 150L622 160L607 170" fill="none" stroke="#126e66" stroke-width="3"/><text x="430" y="56" fill="#61716d" font-size="15" text-anchor="middle">从观测到的梯度变化中学习局部曲率</text></svg>