<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-labelledby="title desc"><title id="title">2×2 主元不能逐项当作正对角主元</title><desc id="desc">H=[[0,2],[2,0]] 对角元为零，但存在正负特征值 ±2；把负特征值裁剪到正阈值 δ 后，获得非对角的正定修正。</desc><rect width="860" height="300" rx="18" fill="#fbfaf6"/><text x="35" y="46" font-size="20" font-weight="700" fill="#263a33">2×2 主元不能逐项当作正对角主元</text><text x="35" y="70" font-size="14" fill="#63756f">保留块结构，再分析惯性与所需修正</text><rect x="28" y="92" width="188" height="124" rx="14" fill="#e4f2ec" stroke="#176e62" stroke-opacity=".35"/><text x="122" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">零对角元</text><text x="122" y="166" text-anchor="middle" font-size="16" fill="#176e62">[[0,2],[2,0]]</text><text x="122" y="192" text-anchor="middle" font-size="13" fill="#61716d">不能直接做首个 1×1 主元</text><rect x="235" y="92" width="188" height="124" rx="14" fill="#fce9dc" stroke="#a45435" stroke-opacity=".35"/><text x="329" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">2×2 主元</text><text x="329" y="166" text-anchor="middle" font-size="16" fill="#a45435">特征值 2、−2</text><text x="329" y="192" text-anchor="middle" font-size="13" fill="#61716d">含正负曲率</text><rect x="442" y="92" width="188" height="124" rx="14" fill="#efebfa" stroke="#6451a0" stroke-opacity=".35"/><text x="536" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">块内修正</text><text x="536" y="166" text-anchor="middle" font-size="16" fill="#6451a0">−2 → δ</text><text x="536" y="192" text-anchor="middle" font-size="13" fill="#61716d">避免奇异</text><rect x="649" y="92" width="188" height="124" rx="14" fill="#e4f2ec" stroke="#176e62" stroke-opacity=".35"/><text x="743" y="130" text-anchor="middle" font-weight="700" font-size="18" fill="#21312e">重建矩阵</text><text x="743" y="166" text-anchor="middle" font-size="16" fill="#176e62">B 正定</text><text x="743" y="192" text-anchor="middle" font-size="13" fill="#61716d">改动不只在对角</text><path d="M218 154h14m-5-6 6 6-6 6" stroke="#657a72" stroke-width="2.4" fill="none"/><path d="M425 154h14m-5-6 6 6-6 6" stroke="#657a72" stroke-width="2.4" fill="none"/><path d="M632 154h14m-5-6 6 6-6 6" stroke="#657a72" stroke-width="2.4" fill="none"/><text x="35" y="267" font-size="14" fill="#61716d">δ=1 时修正矩阵 B=[[1.5,0.5],[0.5,1.5]]</text></svg>