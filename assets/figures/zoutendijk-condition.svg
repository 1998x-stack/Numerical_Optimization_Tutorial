<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="z-title z-desc"><title id="z-title">Zoutendijk 条件中的方向夹角</title><desc id="z-desc">负梯度向右，搜索方向向右上方，两者夹角为 theta；角度接近九十度时，搜索方向的负梯度投影变小。</desc><rect width="860" height="330" rx="18" fill="#fbfaf6"/><path d="M110 245H760" stroke="#b8c6bf" stroke-width="2"/><path d="M110 245L610 245" stroke="#126e66" stroke-width="7" stroke-linecap="round"/><path d="M110 245L480 70" stroke="#bd633f" stroke-width="7" stroke-linecap="round"/><path d="M225 245A115 115 0 0 0 213 195" stroke="#7461ba" stroke-width="4" fill="none"/><path d="M110 245L480 245" stroke="#126e66" stroke-width="2" stroke-dasharray="7 6"/><g fill="#1d2b2a" font-size="18"><text x="615" y="252">−gₖ（最速下降）</text><text x="490" y="66" fill="#bd633f">pₖ</text><text x="238" y="203" fill="#7461ba">θₖ</text><text x="120" y="280" font-size="14" fill="#61716d">当前迭代点 xₖ</text><text x="530" y="120" font-size="15">有效下降分量 ∝ cos θₖ</text></g><path d="M485 139L425 166" stroke="#7461ba" stroke-width="2"/><rect x="520" y="175" width="275" height="90" rx="12" fill="#e6f2ed" stroke="#cbded4"/><text x="540" y="205" fill="#1d2b2a" font-size="15">若 cos θₖ ≥ δ &gt; 0</text><text x="540" y="234" fill="#126e66" font-size="17" font-weight="700">则 ‖∇f(xₖ)‖ → 0</text></svg>