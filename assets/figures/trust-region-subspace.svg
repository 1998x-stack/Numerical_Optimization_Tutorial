<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" role="img" aria-labelledby="title desc"><title id="title">二维子空间比 Dogleg 折线具有更多候选</title><desc id="desc">一个信赖域圆内画出 Dogleg 的折线和另一条到达更优子空间候选点的路线。</desc><rect width="860" height="290" rx="18" fill="#fbfaf6"/><circle cx="260" cy="135" r="112" stroke="#b6a6ce" stroke-width="2.5" fill="#efebfa" fill-opacity=".55"/><path d="M260 135L204 185L224 241" fill="none" stroke="#126e66" stroke-width="5"/><path d="M260 135L216 232" stroke="#bd633f" stroke-width="5" stroke-dasharray="8 6"/><circle cx="216" cy="232" r="8" fill="#bd633f"/><g fill="#263a33" font-size="17"><text x="460" y="92">Dogleg：预测下降 ≈ 1.9650</text><text x="460" y="142">二维精确解：下降 ≈ 2.1913</text><text x="460" y="200">全平面包含折线全部候选</text></g></svg>