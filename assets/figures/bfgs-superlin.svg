<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" role="img" aria-labelledby="bfgs-superlin-title bfgs-superlin-desc"><title id="bfgs-superlin-title">BFGS 与最速下降的误差比率</title><desc id="bfgs-superlin-desc">折线表示每次迭代的误差比率 e_{k+1}/e_k：BFGS 曲线逐步降到接近零，最速下降曲线长期停在 1 附近。</desc><rect width="660" height="300" rx="16" fill="#f7f4ee"/><line x1="70" y1="250" x2="620" y2="250" stroke="#263a33" stroke-width="2"/><line x1="70" y1="250" x2="70" y2="40" stroke="#263a33" stroke-width="2"/><line x1="70" y1="120" x2="620" y2="120" stroke="#e0d9cb" stroke-width="1.5" stroke-dasharray="6 6"/><text x="590" y="112" font-size="13" font-family="system-ui, sans-serif" fill="#8a8070">ratio 1</text><polyline points="70,74 130,90 200,92 260,88 320,105 380,122 440,140 500,185 545,238 590,248 620,250" fill="none" stroke="#126e66" stroke-width="3"/><polyline points="70,74 160,90 260,105 360,120 460,122 560,120 620,119" fill="none" stroke="#bd633f" stroke-width="3"/><g font-size="14" font-family="system-ui, sans-serif"><text x="470" y="245" fill="#126e66">BFGS：比率→0</text><text x="380" y="140" fill="#bd633f">最速下降：比率≈1</text><text x="600" y="272">k</text><text x="36" y="50">ratio</text></g></svg>